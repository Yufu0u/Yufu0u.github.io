        <!-- ===== giscus 评论组件（上线前需完成一次配置） =====
             步骤：
             1. 仓库 Settings → General → Features → 勾选 Discussions
             2. 安装 giscus App：https://github.com/apps/giscus （选这个仓库授权）
             3. 打开 https://giscus.app/zh-CN ，按页面提示填写：
                - 仓库：你的GitHub用户名/你的GitHub用户名.github.io
                - 映射方式：pathname（讨论标题包含页面路径）
                - Discussion 分类：Announcements（推荐，别人只能回复不能开新帖）
             4. 复制 giscus.app 生成的 <script ...>...</script> 整段代码，
                取消下面注释并粘贴进去（替换掉 "配置完成前 giscus 暂未启用" 那行）
        -->
        <div class="comments">
            <h2> 留言板</h2>
            <!-- 配置完成前 giscus 暂未启用：请按上方注释操作，然后把生成的脚本粘贴到这里
            <script src="https://giscus.app/client.js"
                    data-repo="你的GitHub用户名/你的GitHub用户名.github.io"
                    data-repo-id="（giscus.app 会给你）"
                    data-category="Announcements"
                    data-category-id="（giscus.app 会给你）"
                    data-mapping="pathname"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="top"
                    data-theme="preferred_color_scheme"
                    data-lang="zh-CN"
                    data-loading="lazy"
                    crossorigin="anonymous"
                    async>
            </script>
            -->
            <p class="comments-hint">评论区配置中，敬请期待（需要 GitHub 账号登录后留言）</p>
        </div>
